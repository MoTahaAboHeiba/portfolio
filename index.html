<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoTaha AI</title>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #0d1117;
      --accent: #22D3EE;
      --muted: #64748b;
      --text: #e2e8f0;
      --border: rgba(34, 211, 238, 0.15);
      --bubble-user: #0f1e2e;
      --bubble-bot: #0d1117;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    #app {
      width: min(1100px, 100%);
      height: min(92vh, 780px);
      border: 1px solid rgba(34, 211, 238, 0.12);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.8), 0 18px 40px rgba(15, 23, 42, 0.6);
      display: flex;
      flex-direction: column;
    }

    #portfolio-header {
      background: var(--panel);
      border-bottom: 1px solid rgba(34, 211, 238, 0.1);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: Arial, Helvetica, sans-serif;
    }

    .brand-divider {
      color: #1e3a4a;
      font-size: 12px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .status-text {
      color: var(--muted);
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 16px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .portfolio-message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      margin: 10px 0;
    }

    .portfolio-message-row.user {
      justify-content: flex-end;
    }

    .portfolio-message {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .portfolio-message.user {
      align-items: flex-end;
    }

    .portfolio-message.bot {
      align-items: flex-start;
    }

    .portfolio-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
      font-family: 'Courier New', monospace;
    }

    .portfolio-bubble {
      display: inline-block;
      max-width: 85%;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      box-sizing: border-box;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .portfolio-bubble.bot {
      background: var(--bubble-bot);
      border: 1px solid rgba(34, 211, 238, 0.08);
      border-left: 2px solid var(--accent);
      border-radius: 0 8px 8px 8px;
    }

    .portfolio-bubble.user {
      background: var(--bubble-user);
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-right: 2px solid var(--accent);
      border-radius: 8px 0 8px 8px;
      max-width: 70%;
    }

    .portfolio-bubble p,
    .portfolio-bubble strong,
    .portfolio-bubble a,
    .portfolio-bubble li,
    .portfolio-bubble span {
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
    }

    .portfolio-bubble strong {
      color: var(--accent);
    }

    .portfolio-bubble a {
      color: var(--accent);
      text-decoration: none;
    }

    #composer {
      border-top: 1px solid rgba(34, 211, 238, 0.1);
      background: var(--panel);
      padding: 10px 20px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid rgba(34, 211, 238, 0.15);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
    }

    #chat-input:focus {
      border-color: rgba(34, 211, 238, 0.35);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.08);
    }

    #send-button {
      border: 1px solid rgba(34, 211, 238, 0.25);
      background: rgba(34, 211, 238, 0.08);
      color: var(--accent);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    #send-button:hover:not(:disabled) {
      border-color: rgba(34, 211, 238, 0.45);
      background: rgba(34, 211, 238, 0.12);
    }

    #send-button:disabled,
    #chat-input:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 20px 10px;
      background: var(--bg);
    }

    .example-pill {
      background: transparent;
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      padding: 0 12px;
      min-height: 32px;
      height: 32px;
      flex: 0 0 auto;
      box-shadow: none;
      cursor: pointer;
    }

    .example-pill:hover {
      border-color: rgba(34, 211, 238, 0.35);
      color: var(--accent);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.18);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="portfolio-header">
      <div class="brand">
        <span class="brand-mark">// MOTAHA AI</span>
        <span class="brand-divider">|</span>
        <span class="brand-subtitle">Ask me anything about my engineering work</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span class="status-text">taha@portfolio ~</span>
      </div>
    </div>

    <div class="example-row">
      <button class="example-pill">Who are you?</button>
      <button class="example-pill">How does your Lakehouse work?</button>
      <button class="example-pill">What certifications do you hold?</button>
      <button class="example-pill">Explain your experience in Data Engineering</button>
      <button class="example-pill">Explain your experience in AI Engineering</button>
    </div>

    <div id="chat-log"></div>

    <div id="composer">
      <textarea id="chat-input" rows="1" placeholder="Ask me about my projects, decisions, or background..."></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    // Change to your Koyeb URL before deploying

    const STARTUP_MESSAGE = "Hey, I'm Taha. Ask me anything about my engineering work — projects, technical decisions, architecture choices, or what I can bring to your team.";
    const state = {
      history: [{ role: "assistant", content: STARTUP_MESSAGE }],
    };
    let streaming = false;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderMessage(role, content) {
      const safe = escapeHtml(content).replace(/\n/g, "<br>");
      if (role === "user") {
        return `
          <div class="portfolio-message-row user">
            <div class="portfolio-message user">
              <div class="portfolio-bubble user">${safe}</div>
            </div>
          </div>
        `;
      }
      return `
        <div class="portfolio-message-row bot">
          <div class="portfolio-avatar">MT</div>
          <div class="portfolio-message bot">
            <div class="portfolio-bubble bot">${safe}</div>
          </div>
        </div>
      `;
    }

    function renderHistory() {
      const log = document.getElementById("chat-log");
      if (!log) return;
      log.innerHTML = state.history.map(item => renderMessage(item.role, item.content)).join("");
      scrollToBottom();
    }

    function scrollToBottom() {
      const log = document.getElementById("chat-log");
      if (!log) return;
      log.scrollTop = log.scrollHeight;
    }

    function setLoading(isLoading) {
      const input = document.getElementById("chat-input");
      const button = document.getElementById("send-button");
      if (!input || !button) return;
      input.disabled = isLoading;
      button.disabled = isLoading;
    }

    function appendChunk(chunk) {
      const bubble = document.getElementById("streaming-bubble");
      if (!bubble) return;
      bubble.innerHTML += chunk;
      scrollToBottom();
    }

    async function streamChat(message, history) {
      const response = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const chunk = line.slice(6);
          if (chunk === "[DONE]") return;
          appendChunk(chunk);
        }
      }
    }

    async function submitPrompt() {
      const input = document.getElementById("chat-input");
      if (!input || streaming) return;

      const message = input.value.trim();
      if (!message) return;

      streaming = true;
      setLoading(true);
      state.history.push({ role: "user", content: message });
      renderHistory();

      const log = document.getElementById("chat-log");
      const botRow = document.createElement("div");
      botRow.className = "portfolio-message-row bot";
      botRow.innerHTML = `
        <div class="portfolio-avatar">MT</div>
        <div class="portfolio-message bot">
          <div id="streaming-bubble" class="portfolio-bubble bot"></div>
        </div>
      `;
      log.appendChild(botRow);
      scrollToBottom();

      try {
        const historySnapshot = state.history.slice();
        await streamChat(message, historySnapshot);
        const bubble = document.getElementById("streaming-bubble");
        const finalText = bubble ? bubble.innerText : "";
        if (bubble) bubble.id = "";
        state.history.push({ role: "assistant", content: finalText.trim() || "" });
        renderHistory();
      } catch (error) {
        const bubble = document.getElementById("streaming-bubble");
        if (bubble) {
          bubble.id = "";
          bubble.textContent = "Something went wrong on my end. Try again in a moment.";
        }
        state.history.push({ role: "assistant", content: "Something went wrong on my end. Try again in a moment." });
        renderHistory();
      } finally {
        setLoading(false);
        streaming = false;
        input.value = "";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("chat-input");
      const button = document.getElementById("send-button");
      const pills = document.querySelectorAll(".example-pill");

      renderHistory();

      button.addEventListener("click", submitPrompt);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          submitPrompt();
        }
      });

      pills.forEach((pill) => {
        pill.addEventListener("click", () => {
          if (streaming) return;
          input.value = pill.textContent.trim();
          submitPrompt();
        });
      });
    });
  </script>
</body>
</html>
